  :root{
    --beige:#f1eee6;
    --beige-line:#e6e0d2;
    --ink:#181510;
    --muted:#6b6455;
    --accent:#3a3226;
    --highlight:#e8dcc0;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html, body{ direction:rtl; text-align:right; margin:0; height:100%; }
  body{ font-family:'Iranian Sans', Tahoma, Arial, sans-serif; color:var(--ink); }

  .scroller{
    height:100vh; height:100dvh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
  }
  section.panel{ position:relative; overflow:hidden; scroll-snap-align:start; scroll-snap-stop:always; }
  section.landing{ height:100vh; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  section.team-panel{ min-height:100vh; min-height:100dvh; height:auto; overflow:visible; }

  .grid-bg{
    background-color:var(--beige);
    background-image:
      linear-gradient(var(--beige-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--beige-line) 1px, transparent 1px);
    background-size:32px 32px;
    animation:gridMove 12s linear infinite;
  }
  @keyframes gridMove{ from{ background-position:0 0, 0 0; } to{ background-position:-32px -32px, -32px -32px; } }
  .grid-bg::before{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 30%, rgba(58,50,38,0.06), transparent 60%);
    pointer-events:none;
  }

  .landing{ text-align:center; padding:0 8vw; }
  .landing h1{
    font-size:clamp(1.6rem, 4.4vw, 3rem); font-weight:900; line-height:1.6;
    max-width:820px; margin:0 0 18px; position:relative; z-index:2;
  }
  .landing p{ color:var(--muted); font-size:1rem; max-width:520px; margin:0; position:relative; z-index:2; }
  .swipe-hint{
    position:absolute; bottom:5vh; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--muted); font-size:0.85rem; z-index:2; cursor:pointer;
    background:none; border:none; font-family:inherit; white-space:nowrap;
  }
  .swipe-hint .arrow{
    width:32px; height:32px; border-radius:50%; border:1.5px solid var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:1rem;
    animation:bounce 1.8s ease-in-out infinite;
  }
  @keyframes bounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(8px); } }

  .team-panel{ padding:60px 6vw 40px; }
  @media (max-width:520px){ .team-panel{ padding:44px 6vw 30px; } }
  .grid{
    display:grid; grid-template-columns:repeat(5, 1fr); gap:22px;
    max-width:1280px; margin:0 auto; position:relative; z-index:2;
  }
  @media (max-width:900px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:520px){ .grid{ grid-template-columns:1fr; gap:18px; } }

  .section-title{ text-align:center; max-width:640px; margin:0 auto 32px; position:relative; z-index:2; }
  .section-title h2{ font-size:clamp(1.4rem, 3.2vw, 2.4rem); font-weight:900; margin:0 0 10px; }
  .section-title p{ color:var(--muted); margin:0; font-size:0.95rem; }

  .member-btn{
    display:flex; flex-direction:column; justify-content:flex-start; align-self:start;
    background:none; border:none; padding:0; cursor:pointer; text-align:right;
    width:100%; font-family:inherit; color:inherit; transition:transform .2s ease;
  }
  .member-btn:active{ transform:scale(0.97); }
  .photo-wrap{ width:100%; flex-shrink:0; aspect-ratio:1/1; overflow:hidden; border-radius:10px; background:#e9e4d6; }
  .photo-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
    
    transition:transform .35s ease;
  }
  .member-btn:hover .photo-wrap img{ transform:scale(1.05); }
  .caption{ margin-top:12px; display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .caption .name{ font-weight:800; font-size:1rem; display:block; }
  .caption .role{ color:var(--muted); font-size:0.88rem; display:block; margin-top:2px; }
  .caption .arrow{ color:var(--ink); font-size:1.1rem; flex-shrink:0; }

  footer{ position:relative; z-index:2; text-align:center; padding:40px 6vw 30px; color:var(--muted); font-size:0.85rem; }

  /* ---------- Shared overlay/modal animation styles ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(24,21,16,0);
    display:flex; align-items:center; justify-content:center; padding:20px;
    visibility:hidden; pointer-events:none;
    transition:background-color .35s ease, visibility 0s linear .35s;
  }
  .overlay.open{
    background:rgba(24,21,16,0.6); visibility:visible; pointer-events:auto;
    transition:background-color .35s ease;
  }
  #overlay{ z-index:50; }
  #resume-overlay{ z-index:60; } /* sits above the profile modal */

  .modal{
    background:var(--card); max-width:720px; width:100%; max-height:88vh;
    overflow-y:auto; border-radius:14px; display:grid; grid-template-columns:1fr 220px; gap:0;
    opacity:0; transform:translateY(24px) scale(0.96);
    transition:opacity .32s cubic-bezier(.22,.9,.32,1), transform .32s cubic-bezier(.22,.9,.32,1);
  }
  .overlay.open .modal{ opacity:1; transform:translateY(0) scale(1); }
  @media (max-width:600px){ .modal{ grid-template-columns:1fr; } }
  .modal img{
    width:100%; height:100%; object-fit:cover; min-height:200px; order:2;
    
  }
  .modal-body{ padding:28px; position:relative; order:1; display:flex; flex-direction:column; }
  .modal-body h2{
    margin:0 0 4px; font-size:1.5rem; opacity:0; transform:translateY(8px);
    transition:opacity .3s ease .08s, transform .3s ease .08s;
  }
  .modal-body .role{
    color:var(--accent); font-weight:700; margin-bottom:14px; display:block; font-size:0.95rem;
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease .13s, transform .3s ease .13s;
  }
  .modal-body p{
    line-height:1.8; color:#333; margin:0 0 12px; font-size:0.98rem;
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease .18s, transform .3s ease .18s;
  }
  .modal-body ul{
    padding-right:20px; padding-left:0; margin:0 0 12px; color:#333; line-height:1.8; font-size:0.95rem;
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease .22s, transform .3s ease .22s;
  }
  .modal-actions{
    display:flex; flex-wrap:wrap; gap:10px; margin-top:auto; padding-top:8px;
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease .26s, transform .3s ease .26s;
  }
  .overlay.open .modal-body h2,
  .overlay.open .modal-body .role,
  .overlay.open .modal-body p,
  .overlay.open .modal-body ul,
  .overlay.open .modal-actions{
    opacity:1; transform:translateY(0);
  }
  .modal-body a.email-link{ color:var(--accent); text-decoration:none; font-weight:700; font-size:0.95rem; }

  .btn-resume{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:#fff; text-decoration:none;
    font-family:inherit; font-weight:700; font-size:0.9rem;
    padding:10px 18px; border-radius:8px; border:none; cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .btn-resume:hover{ background:#241f16; transform:translateY(-1px); }
  .btn-resume:active{ transform:translateY(0) scale(0.97); }
  .btn-resume svg{ width:16px; height:16px; flex-shrink:0; }

  .btn-resume-outline{
    display:inline-flex; align-items:center; gap:8px;
    background:transparent; color:var(--accent); border:1.5px solid var(--accent);
    font-family:inherit; font-weight:700; font-size:0.9rem;
    padding:9px 16px; border-radius:8px; cursor:pointer; text-decoration:none;
    transition:background .2s ease, color .2s ease;
  }
  .btn-resume-outline:hover{ background:var(--accent); color:#fff; }

  .close-btn{
    position:absolute; top:14px; left:14px; background:none; border:none;
    font-size:1.5rem; cursor:pointer; color:var(--ink);
    transition:transform .2s ease, opacity .2s ease;
  }
  .close-btn:hover{ transform:rotate(90deg); }

  /* ---------- Resume overlay: single-column content card ---------- */
  .resume-modal{
    background:var(--card); max-width:600px; width:100%; max-height:85vh;
    overflow-y:auto; border-radius:14px; padding:36px;
    opacity:0; transform:translateY(20px) scale(0.95);
    transition:opacity .3s cubic-bezier(.22,.9,.32,1), transform .3s cubic-bezier(.22,.9,.32,1);
    position:relative;
  }
  #resume-overlay.open .resume-modal{ opacity:1; transform:translateY(0) scale(1); }

  .resume-tag{
    display:inline-block;
    background:var(--highlight);
    color:var(--accent);
    font-weight:800;
    font-size:1.15rem;
    padding:8px 16px;
    border-radius:8px;
    margin-bottom:18px;
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease .1s, transform .3s ease .1s;
  }
  #resume-overlay.open .resume-tag{ opacity:1; transform:translateY(0); }

  .resume-modal h3{
    font-size:1.3rem;
    margin:0 0 6px;
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease .16s, transform .3s ease .16s;
  }
  #resume-overlay.open .resume-modal h3{ opacity:1; transform:translateY(0); }

  .resume-modal .resume-role{
    color:var(--muted);
    font-size:0.92rem;
    margin-bottom:22px;
    display:block;
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease .2s, transform .3s ease .2s;
  }
  #resume-overlay.open .resume-modal .resume-role{ opacity:1; transform:translateY(0); }

  .resume-modal p.resume-text{
    line-height:1.9;
    color:#333;
    font-size:1rem;
    margin:0;
    opacity:0; transform:translateY(8px);
    transition:opacity .3s ease .26s, transform .3s ease .26s;
  }
  #resume-overlay.open .resume-modal p.resume-text{ opacity:1; transform:translateY(0); }
</style>
</head>

  const overlay = document.getElementById('overlay');
  const modalImg = document.getElementById('modal-img');
  const modalName = document.getElementById('modal-name');
  const modalRole = document.getElementById('modal-role');
  const modalBio = document.getElementById('modal-bio');
  const modalFacts = document.getElementById('modal-facts');
  const modalEmail = document.getElementById('modal-email');
  const modalResumeBtn = document.getElementById('modal-resume-btn');
  const closeBtn = document.getElementById('close-btn');

  const resumeOverlay = document.getElementById('resume-overlay');
  const resumeTag = document.getElementById('resume-tag');
  const resumeName = document.getElementById('resume-name');
  const resumeRole = document.getElementById('resume-role');
  const resumeText = document.getElementById('resume-text');
  const resumeCloseBtn = document.getElementById('resume-close-btn');

  let currentPerson = null;
  let currentResumeId = null;

  document.querySelectorAll('.member-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const person = data[btn.dataset.id];
      currentPerson = person;
      currentResumeId = btn.dataset.id;
      modalImg.src = person.photo;
      modalImg.alt = person.name;
      modalName.textContent = person.name;
      modalRole.textContent = person.role;
      modalBio.textContent = person.bio;
      modalFacts.innerHTML = person.facts.map(f => `<li>${f}</li>`).join('');
      if(person.email){ modalEmail.href = `mailto:${person.email}`; modalEmail.style.display = ''; } else { modalEmail.style.display = 'none'; }

      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });

  modalResumeBtn.addEventListener('click', () => {
  if(!currentResumeId) return;
  window.location.href = currentResumeId + '.html'; // e.g. bagheri.html
});

  function closeResume(){
    resumeOverlay.classList.remove('open');
  }
  resumeCloseBtn.addEventListener('click', closeResume);
  resumeOverlay.addEventListener('click', (e) => { if(e.target === resumeOverlay) closeResume(); });

  function closeModal(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    closeResume();
  }
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if(resumeOverlay.classList.contains('open')) closeResume();
      else if(overlay.classList.contains('open')) closeModal();
    }
  });

  const scroller = document.getElementById('scroller');
  document.getElementById('swipe-down').addEventListener('click', () => {
    scroller.scrollTo({ top: scroller.clientHeight, behavior: 'smooth' });
  });
</script>

</body>
</html>
